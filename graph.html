    #topEarningLabel {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
      position: relative;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
      background-color: #000000;
      margin: 1px auto;
    }

    .card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .card h3 {
      margin: 10px 0;
      color: #ffffff;
    }

    font {
      color: red;
      font-family: "Playwrite BE VLG", cursive;
      font-optical-sizing: auto;
      font-weight: 900;
      font-style: normal;
    }

    .card p {
      color: #0da841;
      font-weight: bold;
    }

    .icon {
      position: absolute;
      top: 15px;
      left: 12%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
    }

    @media (max-width: 600px) {
      #topEarningLabel {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .card {
        width: 100%;
      }
    }
  </style>

    // Aggregate the amounts by phone number
    const aggregatedData = transactions.reduce((acc, transaction) => {
      if (!acc[transaction.phone]) {
        acc[transaction.phone] = { ...transaction, amount: 0 };
      }
      acc[transaction.phone].amount += parseFloat(transaction.amount.replace(' Infinity', '')) || 0;
      return acc;
    }, {});

    const aggregatedTransactions = Object.values(aggregatedData);

    const ctx = document.getElementById('userEarningsChart').getContext('2d');
    const labels = aggregatedTransactions.map(t => t.phone);
    const amounts = aggregatedTransactions.map(t => t.amount);

    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Earnings',
          data: amounts,
          backgroundColor: 'rgba(75, 192, 192, 0.2)',
          borderColor: 'rgba(75, 192, 192, 1)',
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    // Finding the top earners
    const sortedTransactions = aggregatedTransactions.sort((a, b) => b.amount - a.amount);
    const topEarners = sortedTransactions.slice(0, 3);

    const topEarningLabel = document.getElementById('topEarningLabel');

    const rankImages = [
      'https://cdn-icons-png.flaticon.com/128/744/744984.png',  // 1st rank
      'https://cdn-icons-png.flaticon.com/128/12090/12090523.png',  // 2nd rank
      'https://cdn-icons-png.flaticon.com/128/11006/11006261.png'   // 3rd rank
    ];

    topEarners.forEach((earner, index) => {
      topEarningLabel.innerHTML += `
        <div class="card">
          <img src="${rankImages[index]}" alt="${index + 1} rank" class="icon">
          <img src="${earner.image_path}" alt="${earner.name}">
          <h3>Hi ${earner.name} <font>Congratulations!</font> <br>Your Are In ${index + 1}${index === 0 ? 'st' : index === 1 ? 'nd' : 'rd'} Rank</h3>
          <p class="highlight">Phone: ${earner.phone}<br>Amount: ${earner.amount}</p>
        </div>
      `;
    });
