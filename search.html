    <button id="show-graph" class="icon-button">

    </button>

    <!-- Popup Modal -->
    <div id="graph-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <iframe id="graph-iframe" src="" width="100%" height="500px"></iframe>
        </div>
    </div>

    <script>
        document.getElementById('show-graph').addEventListener('click', function() {
            document.getElementById('graph-modal').style.display = 'block';
            
            // Set the iframe src to your graph URL
            document.getElementById('graph-iframe').src = 'graph.html'; 
        });
        
        document.querySelector('.close').addEventListener('click', function() {
            document.getElementById('graph-modal').style.display = 'none';
        });
    </script>

        function searchTransaction() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const resultsContainer = document.getElementById('results');
            const totalAmountContainer = document.getElementById('totalAmount');
            resultsContainer.innerHTML = '';
            totalAmountContainer.innerHTML = '';
            
            let totalAmount = 0;
            let nameFound = '';

            transactions.forEach(transaction => {
                if (transaction.name.toLowerCase().includes(input) || transaction.phone.includes(input)) {
                    const transactionElement = document.createElement('div');
                    transactionElement.classList.add('transaction');
                    transactionElement.innerHTML = `
                        <img src="${transaction.image_path || 'https://via.placeholder.com/100'}" alt="${transaction.name}">
                        <div>
                            <p class="name">${transaction.name}</p>
                            <p>Phone: ${transaction.phone}</p>
                            <p>Details: ${transaction.catering_details}</p>
                            <p>Amount: ${transaction.amount}</p>
                            <p>Transaction ID: ${transaction.transaction_id || 'N/A'}</p>
                        </div>
                    `;
                    resultsContainer.appendChild(transactionElement);
                    totalAmount += parseFloat(transaction.amount.replace('Infinity', '0')); // Handle Infinity case
                    nameFound = transaction.name; // Assuming the first found name
                }
            });

            totalAmountContainer.innerText = `Total Amount: ${totalAmount}`;

            // Call voice synthesis function if a name was found
            if (nameFound) {
                speak(`Welcome  ${nameFound}, check your transactions and Total Amount`);
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const speech = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(voice => voice.name.includes('Google UK telugu Female')) || voices.find(voice => voice.name.includes('Microsoft Zira') || voice.name.includes('Google US English') || voice.gender === 'female');
                if (femaleVoice) {
                    speech.voice = femaleVoice;
                }
                window.speechSynthesis.speak(speech);
            } else {
                console.log('Text-to-speech not supported.');
            }
        }

        // Preload voices to ensure they're available when needed
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    </script>




    <script>
        const videoBtn = document.getElementById('videoBtn');
        const audioBtn = document.getElementById('audioBtn');
        const videoContainer = document.getElementById('videoContainer');
        const audioContainer = document.getElementById('audioContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const audioPlayer = document.getElementById('audioPlayer');

        // Array of video sources
        const videos = [
            {
                mp4: 'https://raw.githubusercontent.com/pspk63/itemsongs/main/video1.mp4'
            },
            {
                mp4: 'https://raw.githubusercontent.com/pspk63/itemsongs/main/videoplayback (1).mp4'
            },
            {
                mp4: 'https://raw.githubusercontent.com/pspk63/itemsongs/main/videoplayback.mp4'
            }
        ];

        // Array of audio sources
        const audios = [
            {
                mp3: 'audio1.mp3',
                
            },
            {
                mp3: 'https://example.com/audio2.mp3',
    
            },
            {
                mp3: 'https://example.com/audio3.mp3',
                
            }
        ];

        let currentVideoIndex = 0;
        let currentAudioIndex = 0;

        videoBtn.addEventListener('click', () => {
            videoContainer.style.display = 'block';
            audioContainer.style.display = 'none';
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            videoPlayer.src = videos[currentVideoIndex].mp4;
            videoPlayer.load();
            videoPlayer.play();
        });

        audioBtn.addEventListener('click', () => {
            audioContainer.style.display = 'block';
            videoContainer.style.display = 'none';
            videoPlayer.pause();
            videoPlayer.currentTime = 0;
            audioPlayer.src = audios[currentAudioIndex].mp3;
            audioPlayer.load();
            audioPlayer.play();
        });

        // Event listener for when the video ends
        videoPlayer.addEventListener('ended', () => {
            currentVideoIndex = (currentVideoIndex + 1) % videos.length;
            const nextVideo = videos[currentVideoIndex];
            videoPlayer.src = nextVideo.mp4;
            videoPlayer.load();
            videoPlayer.play();
        });

        // Event listener for when the audio ends
        audioPlayer.addEventListener('ended', () => {
            currentAudioIndex = (currentAudioIndex + 1) % audios.length;
            const nextAudio = audios[currentAudioIndex];
            audioPlayer.src = nextAudio.mp3;
            audioPlayer.load();
            audioPlayer.play();
        });
    </script>
